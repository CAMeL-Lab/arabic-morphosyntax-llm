[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-morphosyntax-llm"
version = "0.1.0"
description = "Reusable LLM pipelines for Arabic morphosyntactic tagging and dependency parsing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Mohamed Adel"},
  {name = "Bashar Alhafni"},
  {name = "Nizar Habash"},
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0,<3"]
gemini = ["google-genai>=1.0,<3"]
retrieval = ["torch>=2.0", "transformers>=4.30,<5"]
all = [
  "openai>=2.0,<3",
  "google-genai>=1.0,<3",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.8",
]

[project.scripts]
arabic-morphosyntax = "arabic_morphosyntax_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arabic_morphosyntax_llm = ["prompts/*.txt", "model_profiles.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
